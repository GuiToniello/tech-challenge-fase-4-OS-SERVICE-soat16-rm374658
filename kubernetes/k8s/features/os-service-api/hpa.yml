apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: os-service-api
  namespace: os-service
  labels:
    app.kubernetes.io/name: os-service-api
    app.kubernetes.io/part-of: techchallenge-oficina
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: os-service-api
  minReplicas: 1
  # Máximo de 2 réplicas por API: 4 APIs × 2 + 10 pods de sistema = 18, dentro dos 22 pods que cabem nos 2 nodes t3.small (com folga para o rollout)
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 30
    # Memória em 150% do request (192Mi): com o tracer .NET do Datadog, o uso em repouso passa dos 80% (~102Mi) e o HPA escalaria sem carga
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 150
