apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: os-service

resources:
  - base/namespace.yml
  - features/os-service-api/configmap.yml
  - features/os-service-api/deployment.yml
  - features/os-service-api/hpa.yml
  - features/os-service-api/service.yml

secretGenerator:
  - name: os-service-api-secrets
    envs:
      - .env

generatorOptions:
  disableNameSuffixHash: true
