apiVersion: v1
kind: Service
metadata:
  name: os-service-api
  namespace: os-service
  labels:
    app.kubernetes.io/name: os-service-api
    app.kubernetes.io/part-of: techchallenge-oficina
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: os-service-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      # Igual a api_node_ports.os em kubernetes/infra/foundation/locals.tf do repo MANAGEMENT (NLB e rota /os)
      nodePort: 30081
