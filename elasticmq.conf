include classpath("application.conf")

# URL das filas montada com o host e a porta de cada requisicao: serve tanto a API no container (http://elasticmq:9324)
# quanto ferramentas no host (http://localhost:9325)
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

# As 8 filas FIFO da saga (OS Service, Management, Billing e Execucao). Cada fila principal manda para a sua DLQ depois de 5 recebimentos sem exclusao.
queues {
  "techchallenge-oficina-management.fifo" {
    fifo = true
    deadLettersQueue {
      name = "techchallenge-oficina-management-dlq.fifo"
      maxReceiveCount = 5
    }
  }

  "techchallenge-oficina-management-dlq.fifo" {
    fifo = true
  }

  "techchallenge-oficina-os-service.fifo" {
    fifo = true
    deadLettersQueue {
      name = "techchallenge-oficina-os-service-dlq.fifo"
      maxReceiveCount = 5
    }
  }

  "techchallenge-oficina-os-service-dlq.fifo" {
    fifo = true
  }

  "techchallenge-oficina-billing.fifo" {
    fifo = true
    deadLettersQueue {
      name = "techchallenge-oficina-billing-dlq.fifo"
      maxReceiveCount = 5
    }
  }

  "techchallenge-oficina-billing-dlq.fifo" {
    fifo = true
  }

  "techchallenge-oficina-execution.fifo" {
    fifo = true
    deadLettersQueue {
      name = "techchallenge-oficina-execution-dlq.fifo"
      maxReceiveCount = 5
    }
  }

  "techchallenge-oficina-execution-dlq.fifo" {
    fifo = true
  }
}
